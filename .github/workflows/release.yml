# Construye .deb, .rpm y Flatpak. Al empujar una etiqueta vX.Y.Z publica una
# release con los tres paquetes; lanzado a mano solo deja los artefactos.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Comprobar que la versión coincide en todos los archivos
        run: |
          v=$(sed -n 's/^VERSION = //p' Makefile)
          grep -q "^Version: *$v$" packaging/rpm/gmk67-rgb.spec
          grep -q "<release version=\"$v\"" data/io.github.aloran_dev.Gmk67Rgb.metainfo.xml
          grep -q "^VERSION = \"$v\"" gmk67-rgb
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dnf install -y rpm-build make systemd-rpm-macros tar
      - name: rpmbuild
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          tar czf ~/rpmbuild/SOURCES/gmk67-rgb-$VERSION.tar.gz \
              --exclude=./.git --transform "s,^\.,gmk67-rgb-$VERSION," .
          rpmbuild -bb --undefine dist packaging/rpm/gmk67-rgb.spec
          mkdir -p dist && cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: dist/*.rpm

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: packaging/flatpak/io.github.aloran_dev.Gmk67Rgb.yml
          bundle: gmk67-rgb-${{ needs.version.outputs.version }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    if: github.ref_type == 'tag'
    needs: [version, deb, rpm, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "GMK67 $GITHUB_REF_NAME" --notes-file - <<'EOF'
          ## Descargas

          | Distribución | Archivo | Instalar |
          |---|---|---|
          | Ubuntu 24.04+, Debian 13+, Mint, Pop!_OS | `.deb` | `sudo apt install ./gmk67-rgb_*_all.deb` |
          | Fedora 39+ | `.rpm` | `sudo dnf install ./gmk67-rgb-*.noarch.rpm` |
          | Cualquiera con Flatpak | `.flatpak` | `flatpak install --user gmk67-rgb-*.flatpak` |

          El `.deb` y el `.rpm` instalan la regla udev que da acceso al teclado.
          **Con Flatpak** hay que instalarla una vez a mano; la app muestra los comandos
          la primera vez que no puede acceder al teclado.

          Solo para el Zuoya GMK67 **v1** (`05ac:024f`, "hfd.cn USB DEVICE") conectado por cable USB.
          EOF
